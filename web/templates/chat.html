<div class="chat-header">
    # {{ .ChannelName }}
</div>

<div class="messages-wrapper" id="messages-list">
    <!-- Messages are reversed in CSS (flex-direction: column-reverse), so we render them in order (oldest first) -->
    <!-- But wait, if we fetch history, we get newest first usually? No, Discord API returns specific order. -->
    <!-- Usually we want newest at the bottom. -->
    <!-- If flex-direction is column-reverse, the first element in DOM is at the bottom. -->
    <!-- So if we have [Msg1, Msg2, Msg3] (Msg3 is newest), we want Msg3 at bottom. -->
    <!-- So Msg3 should be first in DOM? No, column-reverse puts last child at top. -->
    <!-- Wait. column-reverse: "The main-start direction is from bottom to top." -->
    <!-- So first child is at bottom. -->
    <!-- So if I have [Msg1(Old), Msg2, Msg3(New)], and I want Msg3 at bottom, Msg3 should be the first child. -->
    <!-- So I should iterate in Reverse Order (Newest -> Oldest). -->

    {{ range .Messages }}
        {{ template "message.html" . }}
    {{ end }}
</div>

<div class="chat-input-area">
    <form hx-post="/channels/{{ .GuildID }}/{{ .ChannelID }}/messages" hx-swap="none" hx-on:htmx:after-request="this.reset()">
        <input type="text" name="content" class="chat-input" placeholder="Message #{{ .ChannelName }}" autocomplete="off">
    </form>
</div>

<!-- WebSocket Connection for this channel -->
<div hx-ext="ws" ws-connect="/ws?channel={{ .ChannelID }}"></div>
