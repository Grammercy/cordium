<style>
    .modal-backdrop {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000;
    }
    .profile-card {
        width: 300px;
        background: #18191c;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 8px 16px rgba(0,0,0,0.24);
        position: relative;
    }
    .profile-banner {
        height: 60px;
        background-color: {{ if .Color }}{{ .Color }}{{ else }}#5865F2{{ end }};
    }
    .profile-avatar {
        width: 80px; height: 80px;
        border-radius: 50%;
        border: 6px solid #18191c;
        background-color: #18191c;
        background-size: cover;
        position: absolute;
        top: 20px; left: 16px;
    }
    .profile-body {
        margin-top: 50px;
        padding: 16px;
        background: #18191c;
    }
    .profile-username {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
    }
    .profile-discriminator {
        font-size: 16px;
        color: #b9bbbe;
    }
    .divider {
        height: 1px;
        background: #2f3136;
        margin: 12px 0;
    }
    .section-title {
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        color: #b9bbbe;
        margin-bottom: 8px;
    }
    .section-content {
        font-size: 14px;
        color: #dcddde;
        margin-bottom: 12px;
    }
    .roles-list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
    }
    .role-pill {
        display: flex;
        align-items: center;
        background: #292b2f;
        border: 1px solid #292b2f;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        color: #dcddde;
    }
    .role-circle {
        width: 12px; height: 12px;
        border-radius: 50%;
        margin-right: 4px;
    }
</style>

<div class="modal-backdrop" onclick="document.getElementById('profile-modal').innerHTML = ''">
    <div class="profile-card" onclick="event.stopPropagation()">
        <div class="profile-banner"
             style="{{ if .User.Banner }}background-image: url('/media?url=https://cdn.discordapp.com/banners/{{ .User.ID }}/{{ .User.Banner }}.png?size=300'); background-size: cover;{{ else }}background-color: {{ if .Color }}{{ .Color }}{{ else }}#5865F2{{ end }};{{ end }}">
        </div>
        <div class="profile-avatar" style="background-image: url('/media?url=https://cdn.discordapp.com/avatars/{{ .User.ID }}/{{ .User.Avatar }}.png');"></div>

        <div class="profile-body">
            <div class="profile-username">
                {{ .User.Username }}<span class="profile-discriminator">{{ if ne .User.Discriminator "0" }}#{{ .User.Discriminator }}{{ end }}</span>
            </div>

            <div class="divider"></div>

            <div class="section-title">MEMBER SINCE</div>
            <div class="section-content">{{ .JoinedAt | time }}</div>

            {{ if .Roles }}
            <div class="section-title">ROLES</div>
            <div class="roles-list">
                {{ range .Roles }}
                <div class="role-pill" style="border-color: #292b2f;">
                    <div class="role-circle" style="background-color: #{{ printf "%06x" .Color }};"></div>
                    <span style="color: #dcddde;">{{ .Name }}</span>
                </div>
                {{ end }}
            </div>
            {{ end }}
        </div>
    </div>
</div>
